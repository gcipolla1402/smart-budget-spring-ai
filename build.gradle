plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id("io.freefair.lombok") version "9.2.0"

}

group = 'dio'
version = '0.0.1-SNAPSHOT'
description = 'budgeting'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-M4")
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    testAndDevelopmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'spring.ai.openai.api-key', ''
}

def openAiIntegrationTestPatterns = [
        'dio/budgeting/OpenAiChatModelIT.java',
        'dio/budgeting/OpenAiChatClientIT.java',
        'dio/budgeting/ToolCallingIT.java',
        'dio/budgeting/OpenAiTranscriptionModelIT.java',
        'dio/budgeting/OpenAiSpeechModelIT.java'
]

sourceSets {
    test {
        java {
            exclude openAiIntegrationTestPatterns
        }
    }

    openAiIntegrationTest {
        java {
            srcDir 'src/test/java'
            include openAiIntegrationTestPatterns
        }
        resources.srcDir 'src/test/resources'
        compileClasspath = sourceSets.main.output + configurations.openAiIntegrationTestCompileClasspath
        runtimeClasspath = output + compileClasspath + configurations.openAiIntegrationTestRuntimeClasspath
    }
}

configurations {
    openAiIntegrationTestImplementation.extendsFrom testImplementation
    openAiIntegrationTestRuntimeOnly.extendsFrom testRuntimeOnly, testAndDevelopmentOnly
}

tasks.register('openAiIntegrationTest', Test) {
    description = 'Executa os testes que fazem chamadas reais à OpenAI.'
    group = 'verification'
    testClassesDirs = sourceSets.openAiIntegrationTest.output.classesDirs
    classpath = sourceSets.openAiIntegrationTest.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    shouldRunAfter tasks.named('test')
}
